name: Build Exo Pickaxes

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          for f in *xopickaxes*.zip; do unzip -o "$f"; done
          ls -R exopickaxes | head -60

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
          build-root-directory: exopickaxes

      - name: Build
        working-directory: exopickaxes
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: exopickaxes-jar
          path: exopickaxes/build/libs/*.jar
